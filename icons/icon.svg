<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- App Background with smooth rounded corners -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="190" fill="url(#accentGlow)"/>

  <!-- Graduation Cap Icon -->
  <g filter="url(#dropShadow)" transform="translate(0, 10)">
    <!-- Cap Diamond (Mortarboard) -->
    <polygon points="256,120 440,210 256,300 72,210" fill="#ffffff"/>
    
    <!-- Skull Cap Underneath -->
    <path d="M 148,245 C 148,340 364,340 364,245" fill="#e2e8f0"/>
    
    <!-- Tassel Cord & Ornament -->
    <path d="M 256,210 Q 370,225 395,290" fill="none" stroke="#f59e0b" stroke-width="12" stroke-linecap="round"/>
    <circle cx="395" cy="300" r="18" fill="#fbbf24"/>
    <line x1="395" y1="310" x2="395" y2="350" stroke="#f59e0b" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
